# Publicação do site — Verônica Vargas Semijoias
# O site é estático (um index.html e a pasta assets), então não há build:
# o Netlify apenas serve os arquivos da raiz do repositório.

[build]
  publish = "."
  command = ""

# ---------------------------------------------------------------------
# Material interno fora do ar
# O repositório guarda a copy, o design system e o script do banco. Nada
# disso tem senha, mas também não precisa ficar acessível pela URL.
# ---------------------------------------------------------------------
[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/copy-semi-joias.txt"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/design-system-veronica-vargas.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/assets/LEIA-ME.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/assets/originais/*"
  to = "/404.html"
  status = 404
  force = true

# ---------------------------------------------------------------------
# Rotas das categorias
# Cada categoria tem endereço próprio (/categoria/aneis), mas o site é um
# arquivo só: o servidor entrega sempre o index.html e o JavaScript abre a
# vista certa. Precisa vir DEPOIS dos 404 acima e ANTES de qualquer coisa
# que capture tudo, senão engoliria os arquivos reais.
# ---------------------------------------------------------------------
[[redirects]]
  from = "/categoria/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/catalogo"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------
# Cabeçalhos
# ---------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# O HTML carrega o conteúdo do Supabase, então não pode ficar em cache longo
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Logos, imagens e vídeos podem ficar em cache: mudam de nome quando trocam
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# As fontes saíram de dentro do HTML para poderem ser cacheadas por um ano e
# baixadas em paralelo. `immutable` evita até a revalidação condicional.
[[headers]]
  for = "/assets/fontes/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/xml; charset=utf-8"
