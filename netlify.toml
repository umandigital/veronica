# Publicação do site — Verônica Vargas Semijoias
# O site é estático (um index.html e a pasta assets), então não há build:
# o Netlify apenas serve os arquivos da raiz do repositório.

[build]
  publish = "."
  command = ""

# ---------------------------------------------------------------------
# Material interno fora do ar
# O repositório guarda a copy, o design system e o script do banco. Nada
# disso tem senha, mas também não precisa ficar acessível pela URL.
# ---------------------------------------------------------------------
[[redirects]]
  from = "/supabase-setup.sql"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/copy-semi-joias.txt"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/design-system-veronica-vargas.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/assets/LEIA-ME.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/assets/originais/*"
  to = "/404.html"
  status = 404
  force = true

# ---------------------------------------------------------------------
# Cabeçalhos
# ---------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# O HTML carrega o conteúdo do Supabase, então não pode ficar em cache longo
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Logos e imagens podem ficar em cache: mudam de nome quando trocam
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
